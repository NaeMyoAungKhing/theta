<text x="64" y="642" font-size="18" font-weight="800" fill="#fff">Means  (how)</text>
<text x="64" y="668" font-size="13" fill="#fff">• Adaptive-theory approach across 5 leadership mechanisms</text>
<text x="64" y="687" font-size="13" fill="#fff">• Quantitative design; pedagogical immersive method</text>
<text x="64" y="706" font-size="13" fill="#fff">• Self-made questionnaire, validated (Cronbach&#x27;s alpha)</text>
<text x="64" y="725" font-size="13" fill="#fff">• Convenient (non-probability) sample; direct observation</text>
<rect x="646" y="612" width="630" height="156" fill="#1E14C7"/>
<text x="666" y="642" font-size="18" font-weight="800" fill="#fff">Ends  (why / for what)</text>
<text x="666" y="668" font-size="13" fill="#fff">• A guide to the educational management system &amp; mechanisms</text>
<text x="666" y="687" font-size="13" fill="#fff">• Handle change; spur teacher innovation; raise accountability</text>
<text x="666" y="706" font-size="13" fill="#fff">• Better problem-solving &amp; decision-making for quality of</text>
<text x="666" y="725" font-size="13" fill="#fff">education</text>
<text x="666" y="744" font-size="13" fill="#fff">• Finding: significant correlation (adaptive leadership and</text>
<text x="666" y="763" font-size="13" fill="#fff">management)</text>
